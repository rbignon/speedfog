# ---- Item renames (GoodsName/GoodsCaption in item_dlc02.msgbnd.dcx) ----
# Matches the pumpkin/candy icon replacement (spec 1.2, implemented in
# Halloween plan 5). 10010 = Golden Seed, 10020 = Sacred Tear; both carry
# a dedicated Halloween icon. Larval Tear ("Gummy Worm") was dropped on
# 2026-09-01: the item is never dropped during a run, so the reskin was
# invisible.

[[ui]]
bnd = "item_dlc02.msgbnd.dcx"
fmg = "GoodsName"
id = 10010
en = "Pumpkin Seed"
fr = "Graine de citrouille"

[[ui]]
bnd = "item_dlc02.msgbnd.dcx"
fmg = "GoodsCaption"
id = 10010
en = "A plump pumpkin seed, found beneath a jack-o'-lantern's grin.\n\nIncreases a Sacred Flask's number of uses.\n(Can be used after resting at a site of grace.)\n\nEvery autumn they sprout overnight wherever trick-or-treaters have passed, as if the season itself insisted on one more treat."
fr = "Une graine de citrouille bien dodue, trouvée sous le sourire d'une citrouille-lanterne.\n\nAugmente le nombre d'utilisations d'une fiole sacrée.\n(Utilisable après un repos sur un site de grâce.)\n\nChaque automne, elles germent en une nuit sur le passage des chasseurs de bonbons, comme si la saison exigeait une friandise de plus."

[[ui]]
bnd = "item_dlc02.msgbnd.dcx"
fmg = "GoodsName"
id = 10020
en = "Profane Tear"
fr = "Larme profane"

[[ui]]
bnd = "item_dlc02.msgbnd.dcx"
fmg = "GoodsCaption"
id = 10020
en = "A Sacred Tear gone wrong: a chalice of liquid fire that refuses to burn out.\n\nUpgrades the Sacred Flask when offered at a Church of Marika.\n(Can be used after resting at a site of grace.)\n\nWhatever blessed it once stopped answering long ago. The flame keeps drinking anyway."
fr = "Une larme sacrée qui a mal tourné : un calice de feu liquide qui refuse de s'éteindre.\n\nAméliore la fiole sacrée lorsqu'elle est offerte dans une église de Marika.\n(Utilisable après un repos sur un site de grâce.)\n\nCe qui l'avait bénie a cessé de répondre depuis longtemps. La flamme, elle, continue de boire."
