# Halloween theme text catalogue. Consumed by TextTheme (C#) when
# [plugin.halloween] enabled = true in the seed config. `en` is required;
# `fr` is optional (written to the frafr FMG, falls back to en when absent).
# `name` is a human-readable label only, not written to game data.
# Bosses absent here keep their vanilla names. Generate more boss skeletons
# with tools/seed_theme_catalog.py.
#
# Register: commercial kitsch Halloween (candy, costumes, jack-o'-lanterns),
# never genuine-spooky (see the design spec). Same npc_name_id roster as
# summer.toml; "Rennala, Witch of the Full Moon" deliberately mirrors
# summer's "Queen of the Full Sun".

