# ---- Item renames (GoodsName/GoodsCaption in item_dlc02.msgbnd.dcx) ----
# Matches the pumpkin/candy icon replacement (spec 1.2, implemented in
# Halloween plan 5). 10010 = Golden Seed, 8185 = Larval Tear.

[[ui]]
bnd = "item_dlc02.msgbnd.dcx"
fmg = "GoodsName"
id = 10010
en = "Pumpkin Seed"
fr = "Graine de Citrouille"

[[ui]]
bnd = "item_dlc02.msgbnd.dcx"
fmg = "GoodsCaption"
id = 10010
en = "A plump pumpkin seed, found beneath a jack-o'-lantern's grin.\n\nIncreases a Sacred Flask's number of uses.\n(Can be used after resting at a site of grace.)\n\nEvery autumn they sprout overnight wherever trick-or-treaters have passed, as if the season itself insisted on one more treat."
fr = "Une graine de citrouille bien dodue, trouvée sous le sourire d'une citrouille-lanterne.\n\nAugmente le nombre d'utilisations d'une fiole sacrée.\n(Utilisable après un repos sur un site de grâce.)\n\nChaque automne, elles germent en une nuit sur le passage des chasseurs de bonbons, comme si la saison exigeait une friandise de plus."

[[ui]]
bnd = "item_dlc02.msgbnd.dcx"
fmg = "GoodsName"
id = 8185
en = "Gummy Worm"
fr = "Ver en Gélatine"

[[ui]]
bnd = "item_dlc02.msgbnd.dcx"
fmg = "GoodsCaption"
id = 8185
en = "A wriggly gummy worm, chewy and faintly luminous.\n\nGrants rebirth when offered at a site of grace.\n\nSwallowing one whole is said to change a person entirely. Most of the time, it merely changes their appetite."
fr = "Un ver en gélatine bien frétillant, fondant et vaguement luminescent.\n\nOffre une renaissance sur un site de grâce.\n\nOn dit qu'en avaler un tout rond change un être du tout au tout. La plupart du temps, cela ne change que son appétit."

# ---- Loading screen tips (LoadingText in menu_dlc02.msgbnd.dcx) ----
# fmg carries the .fmg extension on purpose: the bnd also contains
# LoadingText_dlc01.fmg and the applier matches by substring; the extension
# pins the base file. Vanilla ids 1-69; overriding a handful means the
# Halloween tips show up occasionally between vanilla ones.

[[ui]]
bnd = "menu_dlc02.msgbnd.dcx"
fmg = "LoadingText.fmg"
id = 1
en = "Crouch to make it harder for the things in the dark to discover you.\nIf a pumpkin-headed stranger stands watch beside a fog gate, walk on by.\nIt is probably a decoration. Probably."
fr = "Accroupissez-vous pour échapper aux choses qui rôdent dans le noir.\nSi un inconnu à tête de citrouille monte la garde près d'une porte de brume, passez votre chemin.\nC'est sans doute une décoration. Sans doute."

[[ui]]
bnd = "menu_dlc02.msgbnd.dcx"
fmg = "LoadingText.fmg"
id = 5
en = "Charge attacks and jump attacks are powerful.\nSo is a sugar rush. Pace yourself on the candy."
fr = "Les attaques chargées et les attaques sautées sont puissantes.\nLa crise d'hyperglycémie aussi. Allez-y doucement sur les bonbons."

[[ui]]
bnd = "menu_dlc02.msgbnd.dcx"
fmg = "LoadingText.fmg"
id = 7
en = "Shields allow you to use the \"Parry\" skill.\nSome guests refuse to take damage until they have been parried.\nTrick, meet treat."
fr = "Les boucliers permettent d'utiliser la compétence « Parade ».\nCertains invités refusent de subir des dégâts tant qu'ils n'ont pas été parés.\nFarce, voici friandise."

[[ui]]
bnd = "menu_dlc02.msgbnd.dcx"
fmg = "LoadingText.fmg"
id = 12
en = "Raise your torch to see further into dark spaces.\nWhatever you see there has been looking at you for a while already."
fr = "Levez votre torche pour éclairer les recoins sombres.\nCe que vous y verrez vous observait déjà depuis un moment."

[[ui]]
bnd = "menu_dlc02.msgbnd.dcx"
fmg = "LoadingText.fmg"
id = 14
en = "Use \"Gestures\" to perform a variety of basic poses.\nWaving at skeletons is allowed. They rarely wave back. Rarely."
fr = "Utilisez les « Gestes » pour adopter diverses poses.\nSaluer les squelettes est permis. Ils répondent rarement. Rarement."
