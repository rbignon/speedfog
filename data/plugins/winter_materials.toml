float3_0 = [0.0, 2.0, 0.95]
float_1 = 2.0
"group_1_CommonUV-UVParam" = [1.0, 1.0]
"group_2_CommonUV-UVParam" = [10.0, 10.0]
"group_3_CommonUV-UVParam" = [12.0, 12.0]

