# Winter plugin: material conversion catalogue (see docs/plugins/winter.md and
# docs/superpowers/specs/2026-11-10-winter-plugin-design.md, Appendices A, B and D).
# Shader names are the file stems of ShaderPath; sampler names are the suffixes after
# the last "_snp_" of Sampler.Type; texture stems are file names without "_a.tif"/"_n.tif".

[snow_textures]
albedo = 'N:\GR\data\Asset\Environment\texture\AET000\AET000_080_a.tif'
normal = 'N:\GR\data\Asset\Environment\texture\AET001\AET001_078_n.tif'
ground_albedo = 'N:\GR\data\Asset\Environment\texture\AET000\AET000_081_a.tif'

# uv_sets: the UV sets the twin's vertex shaders read (TEXCOORD0 upwards, from the input
# signature of its .vpo entries in shader/shaderbdle.shaderbdlebnd.dcx). A matbin drawn by a
# mesh with fewer stays vanilla: the mesh would not be drawn.
[[templates]]
shader = "M[AMSN_V][Snow]"
matbin = "m13_00_503"
samplers = ["Texture2D_0_AlbedoMap_0", "Texture2D_2_AlbedoMap_0", "Texture2D_1_NormalMap_0", "Texture2D_3_NormalMap_0"]
uv_sets = 1
[templates.params]
float_0 = 0.0
float3_0 = [0.0, 2.0, 0.0]
"group_1_CommonUV-UVParam" = [1.0, 1.0]
"group_2_CommonUV-UVParam" = [1.0, 1.0]

[[templates]]
shader = "M[AMSN_V][Ov_N][Snow]_Edge"
