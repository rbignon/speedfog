# Race items catalog (Mario Kart style items for speedfog-racing).
# Consumed by the Python loader (speedfog/race_items.py, exported as graph.json
# race_items) and by the C# RaceItems plugin, when [plugin.race_items] is enabled.
#
# Numbering (n = goods_id - 1450800): marker SpEffect id = goods_id, effect
# SpEffect id = goods_id + 20, use_flag = 1050290100 + n, remove_flag =
# 1050290200 + n. Templates: 10600 is neutral (every rate at 1); 3269 is Golden
# Rune [1]; 102360 is the Viridian Hidden Tear (stateInfo 499, no stamina
# consumption); 425 is a vanilla slowing bullet (moveType 4, forced slow walk);
# 3370 is a self-targeted poison row. `fields` maps SpEffect paramdef field
# names to numbers. Amounts and rates are starting values to calibrate in game.
#
# A neutral marker sets effectEndurance = 1, so it lasts long enough for the
# use event to see it: with the template's 0, the Hammer's use flag stayed off
# in game. The Rune Pouch markers keep 0, their use flag rose.

[icons]
shield = 60385
rune_pouch = 60386
banana = 60387
red_shell = 60388
mushroom = 60389
hammer = 60390
ink = 60391
blue_shell = 60392
lightning = 60393
flask_stopper = 60394
toxic_blossom = 60395

