# Race items catalog (Mario Kart style items for speedfog-racing).
# Consumed by the Python loader (speedfog/race_items.py, exported as graph.json
# race_items) and by the C# RaceItems plugin, when [plugin.race_items] is enabled.
#
# Two goods carry every item: the passive Shield and one usable "Race Item",
# whose icon the racing mod rewrites at runtime to the item it holds. Each
# [[item]] points at one goods; its effect SpEffect, when it has one, is
# applied by the racing mod (to its targets, or to the sender for the Mushroom
# and the Rune Pouches).
#
# Numbering (n = goods_id - 1450800): marker SpEffect id = goods_id, use_flag =
# 1050290100 + n, remove_flag = 1050290200 + n. Item effect SpEffect ids sit in
# 1450820-1450849, at 1450820 + the item's index in the v1 catalog (one goods
# per item, 1450800 + index). Templates: 10600 is neutral (every rate at 1);
# 3269 is Golden Rune [1]; 3370 is a self-targeted poison row. `fields` maps
# SpEffect paramdef field names to numbers. Amounts and rates are starting
# values to calibrate in game.
#
# Some behaviors live in the player's c0000.hks, keyed on a vanilla SpEffect id
# (102360 makes rolls and sprints free, 4101 forces a slow walk), so a copy
# under another id does not get them. An item reaches them by cycling the
# vanilla row (cycleOccurrenceSpEffectId, applied every motionInterval
# seconds), as vanilla row 20011920 does with 4101. A cycled row lasts its own
# endurance after its last application: 102360 adds 15 s to the Mushroom's
# row.
#
# The neutral marker sets effectEndurance = 1 rather than the template's
# one-frame 0, a margin for the use event (the use flag rises in game).
#
# The Hammer's equipWeightChangeRate is a fallback: the racing mod rewrites it
# per target before applying the effect, from the target's equip load.

