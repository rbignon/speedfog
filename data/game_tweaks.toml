# Game-knowledge tables consumed by FogModWrapper (loaded via --data-dir).
# Previously hardcoded in Program.cs; see GameTweaksLoader.cs.

# FogMod ConfigVars: logic variables referenced by fog.txt edge conditions.
# Graph.Construct needs them all defined. Key items and progression flags are
# true because SpeedFog gives every key item at start (softlock prevention).
[config_vars]
# Scaling/logic pass control (not used in SpeedFog)
scalepass = false
logicpass = true
# Great rune requirements (always true: SpeedFog gives all items)
runes_leyndell = true
runes_rold = true
runes_end = true
# Dungeon crawler tier variables (all false: SpeedFog manages its own tiers)
tier1 = false
tier2 = false
tier3 = false
tier4 = false
tier5 = false
tier6 = false
tier7 = false
tier8 = false
tier9 = false
# DLC kindling/imbued requirements (all true: SpeedFog gives all items)
treekindling = true
imbued_base = true
imbued_base_any = true
imbued_dlc = true
imbued_dlc_any = true
# DLC high seal conditions (areas reached via seals, all true)
rauhruins_high_seal = true
rauhbase_high_seal = true
gravesite_seal = true
scadualtus_high_seal = true
ymir_open = true
# Key items (all true: given at start)
academyglintstonekey = true
carianinvertedstatue = true
cursemarkofdeath = true
darkmoonring = true
dectusmedallionleft = true
dectusmedallionright = true
discardedpalacekey = true
drawingroomkey = true
haligtreesecretmedallionleft = true
haligtreesecretmedallionright = true
imbuedswordkey = true
imbuedswordkey1 = true
imbuedswordkey2 = true
imbuedswordkey3 = true
imbuedswordkey4 = true  # DLC key
purebloodknightsmedal = true
roldmedallion = true
runegodrick = true
runemalenia = true
runemohg = true
runemorgott = true
runeradahn = true
runerennala = true
runerykard = true
rustykey = true
# DLC keys (all true: given at start)
omother = true
welldepthskey = true
gaolupperlevelkey = true
gaollowerlevelkey = true
holeladennecklace = true
messmerskindling = true
messmerskindling1 = true
# Boss defeat conditions used in world edges
farumazula_maliketh = true

# Event flags forced ON at map load (open gates locked behind levers).
# See docs/startup-flag-injection.md for how to find new gate flags.
# map can be a map ID ("m35_00_00_00") or "common".

[[startup_flags]]
map = "m35_00_00_00"
flag = 35000565
on = true  # Sewer barred gate 1 (AEG023_330_1000, lever AEG027_002_0503)

[[startup_flags]]
map = "m35_00_00_00"
flag = 35000566
on = true  # Sewer barred gate 2 (AEG023_330_1001, lever AEG027_002_0507)

[[startup_flags]]
map = "m10_00_00_00"
flag = 10000500
on = true  # Stormveil barred gate (AEG219_050_0500, lever AEG219_030_0500)

[[startup_flags]]
map = "m20_01_00_00"
flag = 20018540
on = true  # Enir-Ilim Spiral Rise split door (AEG417_012_0501, ObjAct 417012)

# Boss arenas where vanilla blocks Torrent via Collision.DisableTorrent;
# SpeedFog flips the flag back on the listed collision cells only. Names
# found with `game_inspect list-collisions --torrent-only`. Mohgwyn (m12_05)
# is deliberately excluded. See docs/torrent-arena-patcher.md.

[[torrent_arenas]]
map = "m12_03_00_00"
collisions = ["h006000"]  # deeproot_boss (Fia's Champions)

[[torrent_arenas]]
map = "m12_04_00_00"
collisions = ["h020300", "h020400", "h020500"]  # ainsel_boss (Astel, Naturalborn of the Void)

[[torrent_arenas]]
map = "m12_08_00_00"
collisions = ["h020300", "h020500", "h901000", "h905000"]  # siofra_boss (Ancestor Spirit)

[[torrent_arenas]]
map = "m12_09_00_00"
collisions = ["h020300", "h020500", "h901000", "h905000"]  # siofra_nokron_boss (Regal Ancestor Spirit)

# Spiritspring jump regions (MountJump + MountJumpFall MSB regions, EntityID
# 0, not flag-controllable) removed because they bypass a map-splits
# chokepoint. Point regions matched within 5m of `position`. Only applied
# when `required_zone` is in the seed's DAG (graph.json area_tiers). See
# docs/map-splits.md, Fort of Reprimand instance.

[[spiritspring_removals]]
map = "m61_49_42_00"
position = [76.7, 303.2, 127.2]
required_zone = "reprimand"  # Fort of Reprimand back-ravine spring (jumps up behind Edredd's chapel)

# MSB assets removed post-Write by VanillaWarpRemover, merged with
# graph.json's per-seed remove_entities. match_group = true matches
# EntityGroupIDs instead of EntityID. Maps absent from the seed output are
# skipped, so entries are no-ops when their map is not in the run.

[[remove_entities]]
map = "m20_01_00_00"
entity_id = 20006662
match_group = true  # Enir-Ilim Outer Wall thorns barrier: FogMod creates it as two assets (AEG410_901/905) sharing this EntityGroup and only disables it when flag 330 is ON, which SpeedFog keeps OFF

# Vanilla Stakes of Marika whose respawn position lands outside the SpeedFog
# DAG (or bypasses a fog gate): injected as RetryPoints tagged "remove"
# before FogMod's Write, which handles the archive extraction and removal.
# See docs/stake-removal.md for the discovery methodology.

[[stake_removals]]
map = "m60_12_09_02"
name = "m60_51_36_00-AEG099_502_2000"  # caelid_radahn: vanilla stake respawns in caelid_preradahn (outside DAG)

[[stake_removals]]
map = "m12_05_00_00"
name = "AEG099_503_9001"  # mohgwyn_boss: activation region inside the arena but respawn just outside, bypasses the fog gate

[[stake_removals]]
map = "m12_04_00_00"
name = "AEG099_504_9001"  # ainsel_boss: respawn c0000_9015 sits ~140 units south of Astel's arena in ainsel_preboss, bypasses the fog gate
