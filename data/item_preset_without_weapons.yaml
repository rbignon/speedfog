# No weapon at key locations or on any boss drop. Removing weapons from
# CoreMechanics only stops sending them there; unconstrained items still fill
# free key slots at random (~5 weapons per seed before the consumables, ~2
# after), and `copydrops` adds a finite copy of every enemy-only weapon.
# This list keeps every weapon (bows, staves, seals and shields included;
# arrows/bolts are a separate group) off the CoreMechanics tags plus the
# boss types CoreMechanics skips (night, dragon, overworld, evergaol). No key
# or quest item is a weapon, so this cannot make an Important placement
# unplaceable. Excludes are unioned across placements: do not list a weapon
# in CoreMechanics here, all its Requires would be excluded and it would
# silently land on a random slot.
- Type: Custom
  Name: No weapons at key locations
  Mode: Custom
  Items:
  - Group: weapons
  Requires: []
  Excludes:
  - Tag: boss
  - Tag: altboss
  - Tag: racemode
  - Tag: criticalpath
  - Tag: caveboss
  - Tag: catacombboss
  - Tag: tunnelboss
  - Tag: graveboss
  - Tag: gaolboss
  - Tag: minidungeonboss
  - Tag: namelessmausoleum
  - Tag: seedtree
  - Tag: church
  - Tag: cross
  - Tag: forgereward
  - Tag: revered
  - Tag: night
  - Tag: dragonboss
  - Tag: overworldboss
  - Tag: evergaol

# Consumables at the same key locations as CoreMechanics.
# Restrictions apply per item ID, so EVERY copy of a listed consumable is
# constrained; quantity and copy count cannot be set: each copy keeps the
# quantity of its vanilla pickup (e.g. Throwing Dagger 3x-8x). Once eligible
# slots are full, the randomizer stacks extra items on them (up to 6 items
# per lot) and, past that, evicts an item already there, which is re-queued
# or falls back to a random slot. Measured over 3-4 seeds (2026-09-18): every
# listed copy lands on an eligible slot (only shop rows stay put, see below)
# and boss drops typically go from 2 to 4 items. Without Rune Arcs (~233
# copies), 0 to 1 of the 55 Golden Seeds/Sacred Tears ends up off its slots;
# with the 62 Rune Arcs (1x each, ~300 copies) it is ~2 (1 to 4). Rune Arcs
# land on ~30% of boss drops (~3 per 10 bosses): kept as is on purpose, to
# be judged in real races.
# Infinite-shop copies stay in shops (separate silo), so items sold only in
# infinite shops can never land here: Boiled Crab/Prawn. Limited-stock shop
# rows (e.g. Moore's livers, 2x with a stock flag) are finite and do move,
# except Rune Arc's 6 shop rows, pinned by the randomizer's `norandomshop`
# group (diste/Base/annotations.txt).
# Craft-only items (Opaline Pickled Liver, Golden/Eternal Sleep Grease) are
# not listed. Soporific, Shield and Festive Grease are left out as weak.
# Ambiguous names need their ID (Golden Vow item vs incantation, the two
# Gourmet Scorpion Stew rows). `Type: Custom` does not auto-add `missable`
# (AllowMissable), so it is listed explicitly.
