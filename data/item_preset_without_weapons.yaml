# Golden Seeds and Sacred Tears at flask upgrade locations.
# Items: fixed by randomizer (EditItems=false). Locations: editable.
# Requires is broader than the thematic seedtree/church/cross set: speedfog
# runs rarely touch those slot types, so we extend to major bosses (boss)
# and DLC scadu/revered spots to ensure ~1.5-3 seeds/tears land per run.
# altboss and sub-dungeon boss tags are intentionally omitted to keep flask
# upgrades on milestone encounters rather than every random catacomb boss.
- Type: SacredFlaskUpgrades
  Mode: Custom
  Items:
  - Name: Golden Seed
    ID: goods:10010
  - Name: Sacred Tear
    ID: goods:10020
  Requires:
  - Tag: boss
  - Tag: seedtree
  - Tag: church
  - Tag: cross
  - Tag: forgereward
  - Tag: revered
  Excludes:
  - Tag: missable

# Upgrade Bell Bearings placed freely.
# Items: fixed by randomizer (EditItems=false). Locations: editable.
- Type: UpgradeBellBearings
  Mode: Anywhere
  Items:
  - Group: upgradeashes
  Excludes:
  - Tag: missable

# Shadow Realm Blessings (Scadutree Fragments, Revered Spirit Ashes).
# Items: fixed by randomizer (EditItems=false). Locations: editable.
# Anywhere (was Important with cross/boss/altboss tags): SpeedFog neutralizes
# the blessing SpEffects (ScaduBlessingNeutralizer), so these are dead pickups
# in a run; the Excludes list (same as the uwyg preset) structurally keeps
# them off boss drops and out of minidungeon reward slots, so they only land
# in generic overworld/legacy pickups. Note the dlcblessing option does NOT
# constrain them here: the explicit empty DlcOnlyItems section below
# (EditItems=true) overrides the randomizer's default DLC-only entries.
- Type: ShadowRealmBlessings
  Mode: Anywhere
  Items: []
  Requires: []
  Excludes:
  - Tag: missable
  - Tag: catacomb
  - Tag: caveboss
  - Tag: cave
  - Tag: catacombboss
  - Tag: evergaol
  - Tag: forge
  - Tag: forgereward
  - Tag: gaolboss
  - Tag: gaol
  - Tag: seedtree
  - Tag: graveboss
  - Tag: grave
  - Tag: boss
  - Tag: racemode
  - Tag: namelessmausoleum
  - Tag: altboss
  - Tag: tunnelboss
  - Tag: tunnel
  - Tag: minidungeon
  - Tag: minidungeonboss

