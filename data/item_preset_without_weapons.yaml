# SpeedFog item placement preset for Elden Ring Item Randomizer.
#
# Controls WHERE randomized items end up in the world.
#
# Variant of item_preset.yaml where key locations and boss drops hand out no
# weapons (select it with [item_randomizer] item_preset_path). Differences:
#   - CoreMechanics lists no weapon (no curated melee weapons, staves, seals
#     or shields), and a `Type: Custom` placement excludes every weapon from
#     key locations and from all boss drops.
#   - A `Type: Custom` "Boss consumables" placement sends consumables (Exalted
#     Flesh, Rune Arcs, boluses, pickled livers, greases, throwables...) to
#     the same key locations; they mostly stack onto the drops instead of
#     replacing them.
#   - Sacred Tears are restricted to major bosses (another `Type: Custom`
#     placement narrows them); Golden Seeds keep all flask-upgrade slots.
# Everything else matches item_preset.yaml.
#
# IMPORTANT: Only CoreMechanics and user-defined `Type: Custom` placements
# allow customizing both items AND locations (EditItems=true, EditLocs=true).
# Other placement types have either fixed items or fixed locations enforced by
# the randomizer's PlacementMeta. Items listed under types with
# EditItems=false are silently replaced by defaults during Resolve(). See the
# `!meta.EditItems && defPlace != null` check in ItemPreset.Resolve()
# (../SoulsRandomizers/RandomizerCommon/Item/ItemPreset.cs).
#
# Placement modes:
#   - Important (KeyItems): inherits LocationGroups for location tags, and
#     items are added to RaceModeItems (placed in a first pass, before all
#     other items).
#   - Custom (CoreMechanics, SacredFlaskUpgrades, and the `Type: Custom`
#     No weapons at key locations, Boss consumables and Sacred Tears at
#     major bosses): per-item Requires/Excludes tags. Constrained items are
#     queued and matched to compatible slots; no separate pass between
#     Custom placements.
#   - Anywhere (QuestItems, UpgradeBellBearings, ShadowRealmBlessings):
#     unrestricted (Excludes only).
#
# Uses Item Randomizer's ItemPreset.ParsePreset().

