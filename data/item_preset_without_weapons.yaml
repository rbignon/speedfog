# LocationGroups: defines the location pool for Important mode placements.
# Important items (key items, seeds/tears, DLC blessings) get first-pass
# priority at these locations before CoreMechanics fills the rest.
LocationGroups:

- Requires:
  - Tag: boss
  - Tag: altboss
  - Tag: racemode
  - Tag: seedtree
  - Tag: church
  - Tag: cross
  Excludes:
  - Tag: missable
  - Tag: night
  - Tag: dragonboss
  - Tag: overworldboss
  - Tag: evergaol


