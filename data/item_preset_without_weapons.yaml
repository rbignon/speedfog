# LocationGroups: the "Important locations" group (only the first entry is
# used). Resolve() copies its Requires/Excludes onto every `Mode: Important`
# placement, here only KeyItems, whose items are then placed in a first
# pass before all other items. Golden Seeds/Sacred Tears (Custom) and
# Shadow Realm Blessings (Anywhere) do not use it.
LocationGroups:

- Requires:
  - Tag: boss
  - Tag: altboss
  - Tag: racemode
  - Tag: seedtree
  - Tag: church
  - Tag: cross
  Excludes:
  - Tag: missable
  - Tag: night
  - Tag: dragonboss
  - Tag: overworldboss
  - Tag: evergaol


