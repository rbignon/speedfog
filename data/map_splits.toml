# Synthetic zones and fog gates that split oversized maps into smaller clusters.
# Consumed by BOTH pipelines:
#   - tools/generate_clusters.py: injected into parsed fog.txt structures
#     (one-way semantics: aside = exit only, bside = entry only)
#   - writer/FogModWrapper (MapSplitsInjector): injected into FogMod's
#     AnnotationData before Graph.Construct, plus EnemyArea split for scaling
# See docs/map-splits.md and docs/superpowers/specs/2026-07-20-enirilim-split-synthetic-fogs-design.md.

[[zones]]
name = "enirilim_upper"
map = "m20_01_00_00"
display_name = "Enir-Ilim Spiral Rise"
tags = ["dlc"]
# EnemyArea split: collision names moved from split_from's EnemyArea so this
# zone gets its own scaling tier. Unprefixed ("h004400"); empty = split inactive.
# Left empty by design for Enir-Ilim: the two zones never occupy two separate
# DAG nodes anymore (see drops_to below), so they always share a tier and no
# EnemyArea partition is needed. The key stays for the generic mechanism.
split_from = "enirilim"
cols = []
# Physical one-way drop from the upper half down into the lower half
# (in-game geometry, validated by Roger). Modeled as a world-graph drop edge so
# cluster-gen produces academy-style overlapping clusters: {enirilim} alone and
# {enirilim_upper, enirilim} merged (mutually exclusive per run).
drops_to = ["enirilim"]

# Fog 2 of the spec: doorway before the Spiral Rise stairs.
# Captured edge-to-edge segment: (-280.792, 66.078, -83.610) -> (-282.340, 66.086, -87.664)
# MakeFrom = "<model> <source-asset-to-copy> <x> <y> <z> <yaw>"; position is the
# segment midpoint. Yaw formula (in-game validated): yaw = atan2(dx, dz) of the
# segment + 90. The AEG099_002 model's width axis runs perpendicular to the
# direction its yaw points, so the gate spans the doorway only when yawed 90
# degrees off the segment direction (with plain atan2(dx, dz) it lies along
# the corridor instead).
[[fogs]]
name = "AEG099_002_9100"
map = "m20_01_00_00"
id = 20011960
text = "Spiral Rise ascent"
make_from = "AEG099_002 AEG099_002_9000 -281.566 66.082 -85.637 -69.1"
aside = { area = "enirilim", text = "in front of the door at the top of the stairs before the Spiral Rise" }
# bside.exit: upper-side exit enables the reverse (descending) route through
# the merged cluster, on top of the default bside=entry-only role.
bside = { area = "enirilim_upper", text = "arriving at the Spiral Rise", exit = true }

# Fog 1 of the spec: passage after the Cleansing Chamber Anteroom, before the
# Leda ambush. Captured segment: (-307.417, 169.778, -308.869) -> (-306.769, 169.778, -306.992)
# (~2.0 m; the AEG099_002 model is wider and will clip into the walls, harmless).
# Yaw = atan2(dx, dz) + 90, see fog 2 above.
# BSide targets the excluded tail zone (never an entry).
[[fogs]]
name = "AEG099_002_9101"
map = "m20_01_00_00"
id = 20011961
text = "Before Leda"
make_from = "AEG099_002 AEG099_002_9000 -307.093 169.778 -307.931 104.0"
# aside.entry: entry for the reverse route (arrive at the before-Leda
# doorway, descend), on top of the default aside=exit-only role.
aside = { area = "enirilim_upper", text = "before Leda's arena", entry = true }
bside = { area = "enirilim_stairs", text = "arriving on the stairs before Leda" }

# --- Fort of Reprimand (m61_49_43_00, DLC Scadu Altus) ---
# First overworld-tile instance: the fort is carved out of the excluded
# `scadualtus` overworld zone; Fog 2's BSide gives the orphan fog.txt area
# scadualtus_edredd_boss (Black Knight Edredd, DefeatFlag 2049430850) its
# first fog boundary, which turns it into a boss_arena cluster.
# Coordinate caution: on overworld tiles the capture tool's Z sign proved
# unreliable per point (Fog 2 and the removed spiritspring needed Z negated
# to match the MSB; Fog 1 did not). All positions below were tuned and
# validated in-game (2026-07-22); verify any new capture against MSB
# architecture with `game_inspect near` before trusting it.
# See the spec 2026-07-21-fort-reprimand-map-splits-design.md.
[[zones]]
name = "reprimand"
map = "m61_49_43_00"
display_name = "Fort of Reprimand"
tags = ["dlc"]
split_from = "scadualtus"
cols = []
# Fort interior enemies (between the two gates), reassigned so they scale
# with the cluster tier instead of staying at the vanilla DLC level: the
# scadualtus EnemyArea is never in the DAG. Derived from the MSB (bbox
# x 0..120, y 370..430, z -92..-10); excludes the c1000 NPC, the gatehouse
# c5401 trio on the approach side, and the crypt behind Fog 2 (boss zone).
enemies = [
  "c5651_9000", "c5651_9001", "c5651_9002", "c5651_9003", "c5651_9009",
  "c5970_9001", "c5970_9002",
  "c5980_9000", "c5980_9001", "c5980_9002",
]

# Fog 1: the fort's front gate, ~5.2 m opening.
# Position and yaw tuned in-game (the raw capture frame matched the MSB here,
# unlike Fog 2; see the header note above).
[[fogs]]
name = "AEG099_003_9100"
map = "m61_49_43_00"
id = 2049431960
text = "Fort of Reprimand gate"
make_from = "AEG099_003 AEG099_090_9000 18.026 386.934 29.585 165.0"
aside = { area = "scadualtus", text = "outside the Fort of Reprimand gate" }
bside = { area = "reprimand", text = "inside the Fort of Reprimand gate" }

# Fog 2: the doorway into Edredd's chapel (the dead-end boss room), ~1.0 m.
# Captured segment (Z negated): (55.411, 396.481, -86.473) -> (54.884, 396.481, -87.314)
# Sides ordered so ASide = chapel: the gate's front physically faces the
# chapel (validated in-game 2026-07-22). Roles with this orientation:
# - aside default (exit of the boss area) = the boss cluster's only exit,
#   back through this gate; MapSplitsInjector gates it on DefeatFlag
#   2049430850 via BossDefeatName since the area is a boss area.
# - aside.entry grant = the boss cluster's entry (warp into the chapel).
# - bside.exit grant = the reprimand cluster's exit (before the chapel).
# - bside default (entry into reprimand at the chapel door) is unwanted for
#   the one-way ascent; filtered by [clusters.reprimand_77e7]
#   allowed_entries in zone_metadata.toml.
[[fogs]]
name = "AEG099_001_9101"
map = "m61_49_43_00"
id = 2049431961
text = "Before Edredd"
make_from = "AEG099_001 AEG099_090_9000 55.148 396.481 -86.894 -57.9"
aside = { area = "scadualtus_edredd_boss", text = "in Black Knight Edredd's chapel", entry = true }
bside = { area = "reprimand", text = "before Black Knight Edredd's chapel", exit = true }
